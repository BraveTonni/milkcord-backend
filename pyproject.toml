[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.121.0",
    "pydantic[email]>=2.12.4",
    "pydantic-settings>=2.11.0",
    "sqlalchemy>=2.0.44",
    "uvicorn>=0.38.0",
    "websockets>=15.0.1",
    "python-dotenv>=1.2.1",
    "asyncpg>=0.30.0",
    "starlette>=0.49.3",
    "python-multipart>=0.0.20",
    "orjson>=3.11.4",
    "aiohttp>=3.13.2",
    "pillow>=12.0.0",
    "mutagen>=1.47.0",
    "alembic>=1.17.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.flake8]
max-line-length = 116
